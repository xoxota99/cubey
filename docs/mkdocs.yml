site_name: Cubey Documentation
site_description: Documentation for the Cubey Rubik's Cube solving robot
site_author: Cubey Team

repo_url: https://github.com/cubey/cubey
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate

nav:
  - Home: index.md
  - API Reference: api.md
  - Development Guide: development.md
  - Hardware:
    - Overview: hardware/index.md
    - Setup Guide: hardware/setup.md
  - Changelog: ../CHANGELOG.md
  - Contributing: ../CONTRIBUTING.md

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
